<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVZ-CX 网页发包版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif}
body{background:#1a1a1e;color:#e0e0e0;padding:20px;max-width:600px;margin:0 auto}
.box{background:#24242c;border-radius:10px;padding:15px;margin:10px 0}
.title{color:#ffd700;text-align:center;margin:10px 0;font-size:18px}
.line{height:1px;background:#b366ff;margin:10px 0}
input{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none;background:#333;color:#fff}
button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:6px;background:#7c3aed;color:#fff;font-weight:bold;cursor:pointer}
button:disabled{background:#444;color:#999;cursor:not-allowed}
.tip{color:#0fdf8f;font-size:14px;margin-bottom:8px}
.log{background:#111;padding:10px;border-radius:6px;margin-top:10px;font-size:12px;line-height:1.4;color:#ccc}
.success{color:#0f0}
.error{color:#f33}
</style>
</head>
<body>

<div class="box">
<div class="title">远程公告</div>
<div class="line"></div>
<div>PVZ-CX工具 - 作者朵朵</div>
<div>仅供学习交流，请勿倒卖</div>
<div class="line"></div>
</div>

<div class="box">
<div class="title">账号配置</div>
<input type="text" id="token" placeholder="EADP-AUTH-TOKEN">
<input type="text" id="personaId" placeholder="EADP-PERSONA-ID">
</div>

<div class="box">
<div class="title">功能菜单</div>

<div class="tip">💎 刷钻石：1次 = 10000钻石</div>
<input type="number" id="repeat" value="1" min="1" placeholder="输入刷钻石次数">
<button id="btn1" onclick="shuaZuanShi()">开始刷钻石</button>

<div class="tip">🃏 刷卡数量：上限 1000000</div>
<input type="number" id="cardCount" value="999999" min="1" max="1000000" placeholder="输入刷卡数量">
<button id="btn2" onclick="shuaKaPai()">刷全卡</button>

<button id="btn3" onclick="tuichu()">退出</button>

<div id="log" class="log"></div>
</div>

<script>
// 已填入你的 Worker 地址
const WORKER_URL = "https://damp-heart-c1a7.3822035620.workers.dev/?url=";

let isRunning = false;

function log(msg, type) {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  const color = type === 'success' ? 'success' : type === 'error' ? 'error' : '';
  el.innerHTML += `[${t}] <span class="${color}">${msg}</span><br>`;
  el.scrollTop = el.scrollHeight;
}

function disableAll() {
  document.getElementById('btn1').disabled = true;
  document.getElementById('btn2').disabled = true;
  document.getElementById('btn3').disabled = true;
}

function enableAll() {
  document.getElementById('btn1').disabled = false;
  document.getElementById('btn2').disabled = false;
  document.getElementById('btn3').disabled = false;
}

async function fetchThroughWorker(targetUrl, options) {
  const proxyUrl = WORKER_URL + encodeURIComponent(targetUrl);
  return fetch(proxyUrl, options);
}

// 刷钻石
async function shuaZuanShi() {
  if (isRunning) return;
  isRunning = true;
  disableAll();

  const token = document.getElementById('token').value.trim();
  const pid = document.getElementById('personaId').value.trim();
  let repeat = parseInt(document.getElementById('repeat').value) || 1;
  if (!token || !pid) {
    log('请填写TOKEN和PersonaID', 'error');
    isRunning = false; enableAll(); return;
  }
  if (repeat < 1) repeat = 1;
  log(`开始刷钻石 → 共${repeat}次，1次=1万钻石`);

  const headersBase = {
    'Content-Type': 'application/json',
    'EADP-AUTH-TOKEN': token,
    'EADP-PERSONA-ID': pid,
    'X-EADP-Client-Id': 'pvzheroes-2015-google-client',
    'X-Pvzh-Platform': 'Android',
    'X-Pvzh-Content-Version': '45a337051e72592e53c9bf8a4b590639',
    'X-Pvzh-Client-Version': '1.64.6'
  };

  for (let i=1; i<=repeat; i++) {
    try {
      const utc = Date.now();
      const headers = { ...headersBase, 'X-Pvzh-UTC': utc };
      await fetchThroughWorker(`https://pvz-heroes.awspopcap.com/updateDailyLoginProgress?userId=${pid}`, {
        method: 'POST', headers,
        body: '{"day":1,"forStreak":true,"currentStreakSetCompleted":false}'
      });
      await new Promise(r=>setTimeout(r,300));

      const res = await fetchThroughWorker(`https://pvz-heroes.awspopcap.com/pvp/v1/leagueRewards/sync?playerId=${pid}`, {
        method: 'POST', headers,
        body: '{"tickets":0,"gems":10000,"sparks":0,"packs":[],"specificCards":[]}'
      });
      log(`第${i}次完成 → 状态：${res.status}`);
      await new Promise(r=>setTimeout(r,300));
    } catch(e) {
      log(`第${i}次失败：${e.message}`, 'error');
    }
  }

  log('✅ 钻石任务全部完成', 'success');
  isRunning = false; enableAll();
}

  const payload = JSON.stringify({
    Sku: "deckRecipe", EventId: null, Cards: cards, ExpectedCost: 10, KeyName: "default"
  });

  const headers = {
    'Content-Type': 'application/json',
    'EADP-AUTH-TOKEN': token,
    'EADP-PERSONA-ID': pid,
    'X-EADP-Client-Id': 'pvzheroes-2015-google-client',
    'X-Pvzh-Platform': 'Android',
    'X-Pvzh-Content-Version': '45a337051e72592e53c9bf8a4b590639',

  } catch(e) {

  isRunning = false; enableAll();
}

// 退出
function tuichu() {
  log('已退出，按钮已解锁', 'success');
  isRunning = false; enableAll();
}
</script>
</body>
</html>
