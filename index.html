<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游戏登录助手</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center}.box{background:#1e293b;padding:30px;border-radius:16px;width:100%;max-width:400px;color:#fff}.title{font-size:22px;text-align:center;margin-bottom:20px}.status{padding:12px;border-radius:8px;text-align:center;margin-bottom:16px;font-weight:500}.waiting{background:#7c7000;color:#fffa}.using{background:#006500;color:#fffa}.disconnect{background:#650000;color:#fffa}.time{text-align:center;margin-bottom:20px;color:#ccc}input{width:100%;padding:12px;border-radius:8px;border:none;margin-bottom:10px;background:#334155;color:#fff}button{width:100%;padding:12px;border-radius:8px;border:none;background:#4f46e5;color:white;font-weight:bold;cursor:pointer;margin-bottom:10px}button:disabled{background:#475569}.log{margin-top:16px;padding:10px;background:#0f172a;border-radius:6px;font-size:13px;color:#ccc}</style></head><body><div class="box"><div class="title">游戏登录助手</div><div class="status disconnect" id="status">未连接</div><div class="time" id="timer"></div><input type="text" id="email" placeholder="邮箱"><button onclick="sendEmail()" id="btnEmail" disabled>提交邮箱</button><input type="text" id="code" placeholder="验证码"><button onclick="sendCode()" id="btnCode" disabled>提交验证码</button><div class="log" id="log"></div></div><script>const WS_URL="wss://draw-residence-scrutiny.ngrok-free.dev";let ws,heartbeatTimer,timerCount,timeLeft=300;function status(txt,cls){document.getElementById('status').innerText=txt;document.getElementById('status').className='status '+cls}function log(txt){document.getElementById('log').innerText=txt}function setEnable(enable){document.getElementById('btnEmail').disabled=!enable;document.getElementById('btnCode').disabled=!enable}function startTimer(){clearInterval(timerCount);timeLeft=300;timerCount=setInterval(()=>{timeLeft--;let m=Math.floor(timeLeft/60),s=timeLeft%60;document.getElementById('timer').innerText=`剩余时间：${m}分${s}秒`;if(timeLeft<=0){clearInterval(timerCount);status("已超时，请刷新","waiting");setEnable(false)}},1000)}function sendHeart(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"heartbeat"}))}function connect(){status("正在连接...","disconnect");log("连接中");setEnable(false);ws=new WebSocket(WS_URL);ws.onopen=()=>{status("已连接，查询状态...","waiting");log("连接成功");heartbeatTimer=setInterval(sendHeart,1000)};ws.onmessage=(e)=>{const d=JSON.parse(e.data);if(d.status==="ok"){if(!timerCount)startTimer();status("✅ 正在使用（5分钟）","using");setEnable(true)}else if(d.status==="waiting"){status(`⌛ 排队中 | 前面有${d.queue}人`,"waiting");log("等待上一位结束...");setEnable(false)}};ws.onclose=()=>{clearInterval(heartbeatTimer);clearInterval(timerCount);timerCount=null;status("连接断开","disconnect");log("已断开，请刷新");setEnable(false)}}function sendEmail(){const v=document.getElementById('email').value.trim();if(!v)return;ws.send(JSON.stringify({type:"email",content:v}));log("邮箱已提交")}function sendCode(){const v=document.getElementById('code').value.trim();if(!v)return;ws.send(JSON.stringify({type:"code",content:v}));log("验证码已提交")}window.onload=connect;</script></body></html>
