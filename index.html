<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏邮箱/验证码提交工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .status {
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .connected {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .disconnected {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .input-group {
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.15);
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        button:disabled {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }
        .log {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>游戏登录助手</h1>
        
        <div class="status disconnected" id="status">正在连接服务器...</div>

        <div class="input-group">
            <input type="email" id="emailInput" placeholder="请输入邮箱地址">
            <button onclick="sendEmail()" id="emailBtn" disabled>提交邮箱</button>
        </div>

        <div class="input-group">
            <input type="text" id="codeInput" placeholder="请输入验证码">
            <button onclick="sendCode()" id="codeBtn" disabled>提交验证码</button>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script>
        // 已配置好你的 ngrok 地址
        const WS_URL = "wss://draw-residence-scrutiny.ngrok-free.dev";
        let ws;
        const logEl = document.getElementById("log");

        // 日志打印
        function addLog(text) {
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${time}] ${text}<br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // 更新连接状态
        function updateStatus(text, isConnected) {
            const statusEl = document.getElementById("status");
            statusEl.textContent = text;
            statusEl.className = `status ${isConnected ? 'connected' : 'disconnected'}`;
            document.getElementById("emailBtn").disabled = !isConnected;
            document.getElementById("codeBtn").disabled = !isConnected;
        }

        // 建立 WebSocket 连接
        function connect() {
            updateStatus("正在连接服务器...", false);
            addLog("尝试连接到服务器...");
            ws = new WebSocket(WS_URL);

            // 连接成功
            ws.onopen = () => {
                addLog("✅ 已成功连接到服务器");
                updateStatus("✅ 已连接到服务器", true);
            };

            // 收到服务端消息
            ws.onmessage = (event) => {
                addLog(`📥 收到服务端消息: ${event.data}`);
                const res = JSON.parse(event.data);
                alert(`提交成功: ${res.msg}`);
            };

            // 连接断开，自动重连
            ws.onclose = () => {
                addLog("🔌 连接断开，2秒后自动重连...");
                updateStatus("连接断开，正在重连...", false);
                setTimeout(connect, 2000);
            };

            // 连接错误
            ws.onerror = (error) => {
                addLog(`❌ 连接错误: ${error}`);
                updateStatus("连接错误，请检查 ngrok 地址", false);
            };
        }

        // 发送邮箱
        function sendEmail() {
            const email = document.getElementById("emailInput").value.trim();
            if (!email) {
                alert("请输入邮箱地址！");
                return;
            }

            if (ws && ws.readyState === WebSocket.OPEN) {
                const message = JSON.stringify({
                    type: "email",
                    content: email
                });
                ws.send(message);
                addLog(`📤 已发送邮箱: ${email}`);
                alert("邮箱已发送，请查看电脑终端");
                document.getElementById("emailInput").value = "";
            } else {
                alert("未连接到服务器，请稍后再试");
            }
        }

        // 发送验证码
        function sendCode() {
            const code = document.getElementById("codeInput").value.trim();
            if (!code) {
                alert("请输入验证码！");
                return;
            }

            if (ws && ws.readyState === WebSocket.OPEN) {
                const message = JSON.stringify({
                    type: "code",
                    content: code
                });
                ws.send(message);
                addLog(`📤 已发送验证码: ${code}`);
                alert("验证码已发送，请查看电脑终端");
                document.getElementById("codeInput").value = "";
            } else {
                alert("未连接到服务器，请稍后再试");
            }
        }

        // 页面加载时自动连接
        window.onload = connect;
    </script>
</body>
</html>
